name: kariyer-seo-service-dev

# Self-contained development stack: the worker as SERVICE_ROLE=all, a Postgres, a RabbitMQ and a
# Garnet.
#
#   export GITHUB_USER=… GITHUB_TOKEN=…      # Kariyer.Messaging.Contracts is on GitHub Packages
#   docker compose -f docker-compose.Development.yml up --build
#   # -> http://127.0.0.1:5310/health
#
# Source is bind-mounted and `dotnet watch` recompiles on save (see Dockerfile.Development).
#
# R2 IS SERVED BY MINIO HERE. The options validator refuses to start any role that writes
# sitemaps with an incomplete Seo:R2 — deliberately, because a blank bucket produces a service
# that reports perfect health for weeks while the live sitemap silently ages. `all` writes, so
# there is no way to run this stack without a bucket, and pointing it at a fake endpoint would
# only move the failure from startup to every rebuild.
#
# MinIO speaks S3, which is what the R2 client already talks, so the stage-and-swap path is
# genuinely exercised rather than stubbed. Browse the output at http://127.0.0.1:59001
# (minioadmin / minioadmin).
#
# The corpus table `company_job` belongs to the Node application, so a stand-in is seeded at
# initdb — without it the facet aggregate has nothing to read and every rebuild is empty.
#
# KNOWN LIMITATION — a FULL rebuild needs the facet manifest, which this stack cannot provide.
# Seo:FacetManifest:Url points at https://kariyerzamani.com/seo/facet-manifest.json, generated
# by kariyer-zamani-web's `npm run generate:facet-manifest` and served from its public/seo/.
# Until that is deployed the URL returns the SPA's HTML, the fetch throws on '<', and
# POST /api/seo/diag/rebuild fails with "The live sitemap set is unchanged" — which is the
# service behaving correctly: it discards a partial set rather than publishing one.
#
# Everything else works without it: boot, health, readiness, migrations, the freshness and CMS
# consumers, the incremental flush, and the R2 stage-and-swap against MinIO. To exercise a full
# rebuild, point the URL at a local copy:
#   Seo__FacetManifest__Url: 'http://minio:9000/kariyer-seo/facet-manifest.json'
# and upload one built from the web repo.

services:
  seo:
    build:
      context: .
      dockerfile: Dockerfile.Development
      args:
        GITHUB_USER: ${GITHUB_USER}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: kariyer-seo-service:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garnet:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - '5310:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # Everything in one process. Safe here and ONLY here — see Dockerfile.Development.
      SERVICE_ROLE: all

      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=kariyer;Username=postgres;Password=postgres'
      ConnectionStrings__RabbitMQ: 'amqp://guest:guest@rabbitmq:5672/'

      Garnet__Enabled: 'true'
      Garnet__ConnectionString: 'garnet:6379'

      # MinIO stands in for Cloudflare R2. ForcePathStyle is what the client already uses for
      # R2, so no client-side difference is needed.
      Seo__R2__Endpoint: 'http://minio:9000'
      Seo__R2__Bucket: 'kariyer-seo'
      Seo__R2__AccessKey: 'minioadmin'
      Seo__R2__SecretKey: 'minioadmin'
      Seo__R2__Prefix: ''

      # Long enough that a background tick does not fire while you are stepping through
      # something. Shorten when you are actually exercising the rebuild.
      Seo__CronInterval: '24:00:00'
      Seo__DebounceWindow: '00:00:30'

      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://127.0.0.1:4318'
    volumes:
      - ./src:/src/src
      - /src/src/Kariyer.Seo.Worker/obj
      - /src/src/Kariyer.Seo.Worker/bin
      - /src/src/Kariyer.Seo.Domain/obj
      - /src/src/Kariyer.Seo.Domain/bin
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kariyer
    ports:
      - '55433:5432'
    volumes:
      - seo-pgdata:/var/lib/postgresql/data
      # company_job belongs to the Node application; cms.seo_page to kariyer-cms-service. This
      # service reads both through keyless projections and creates neither, so a local database
      # needs the stand-ins or its two projections read nothing.
      - ./deploy/smoke/company_job_standin.sql:/docker-entrypoint-initdb.d/10-company-job.sql:ro
      - ./deploy/smoke/cms_seo_page_standin.sql:/docker-entrypoint-initdb.d/20-cms-seo-page.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kariyer']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '55673:5672'
      - '15673:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  garnet:
    # The prerender cache this service purges on expiry. Garnet speaks RESP, so the Redis client
    # talks to it unchanged.
    image: ghcr.io/microsoft/garnet:latest
    ports:
      - '56379:6379'
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - seo-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    # Creates the bucket once and exits. The service does not create its own bucket — in
    # production that is a deliberate deployment step, and a service holding create-bucket
    # rights is more authority than a sitemap writer needs.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kariyer-seo &&
      echo 'bucket ready'
      "

volumes:
  seo-pgdata:
  seo-minio:
